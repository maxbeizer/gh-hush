version: 2

project_name: gh-hush

builds:
  - binary: gh-hush
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/maxbeizer/gh-hush/cmd.Version={{ .Tag }}

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}-{{ .Arch }}"

release:
  prerelease: auto

changelog:
  sort: asc
